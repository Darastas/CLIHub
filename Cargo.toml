[package]
name = "ai-cli-hub"
version = "0.1.2"
edition = "2024"

[[bin]]
name = "clihub"
path = "src/main.rs"

[dependencies]
alacritty_terminal = "0.26.0"
anyhow = "1.0.104"
crossbeam-channel = "0.5.16"
directories = "6.0.0"
eframe = "0.35.0"
egui = "0.35.0"
portable-pty = "0.9.0"
notify-rust = "4"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[build-dependencies]
winres = "0.1"
